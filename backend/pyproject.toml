[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-future-analyzer-backend"
version = "2.0.0"
description = "AI-Powered NSE Stock Screener API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.38",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<3.0.0",
    "pandas_ta>=0.3.14b0",
    "pytz>=2023.3",
    "anyio>=4.0.0",
    "starlette>=0.36.0",
    "apscheduler>=3.10.0,<4.0.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "requests>=2.31.0"
]
