[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-future-analyzer-backend"
version = "2.0.0"
description = "AI-Powered NSE Stock Screener API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "yfinance",
    "pandas",
    "numpy",
    "ta",
    "pytz",
    "anyio",
    "starlette",
    "apscheduler",
    "openpyxl",
    "xlsxwriter",
    "requests"
]
